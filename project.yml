name: Fretline
options:
  bundleIdPrefix: com.rbc33
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Fretline:
    type: application
    platform: iOS
    sources:
      - path: Fretline
        excludes:
          - "Web/**"
      # Carpeta copiada tal cual al bundle (alphaTab, SoundFont, app.js…)
      - path: Fretline/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rbc33.fretline
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Fretline/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: Fretline/Info.plist
      properties:
        CFBundleDisplayName: Fretline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.rbc33.fretline.guitarpro
            UTTypeDescription: Guitar Pro
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gp, gp3, gp4, gp5, gpx]
          - UTTypeIdentifier: com.rbc33.fretline.musicxml
            UTTypeDescription: MusicXML
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [musicxml]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Guitar Pro
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.rbc33.fretline.guitarpro]
          - CFBundleTypeName: MusicXML
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.rbc33.fretline.musicxml]
